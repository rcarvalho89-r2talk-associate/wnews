curate_ai_insights_task:
  description: >
    Collect and organize the most relevant and impactful artificial intelligence news published in April 2025, focusing on key developments from the past week. This task aims to provide curated insights for inclusion in a weekly AI newsletter.

    Detailed Instructions:

    Content Selection:
    Identify at least 30 significant AI developments or announcements from the past week. Prioritize:
      Updates with high potential impact on businesses.
      Important technical breakthroughs or innovations.
      Official announcements from major players such as OpenAI, Microsoft, Google, Meta, AWS, IBM, and other influential organizations.

    Trusted Sources:
    Use only reliable and secure sources, such as:
      Official company blogs and press releases.
      Research publications and leading tech consultancies (e.g., Gartner). 
      Respected and well-established tech news outlets. 
      Always include the direct link to the original source for verification.

    Mandatory links to monitor:
      https://news.microsoft.com/ai/
      https://openai.com/research
      https://openai.com/news/
      https://aws.amazon.com/blogs/aws/
      https://newsroom.ibm.com/latest-news-artificial-intelligence
      https://www.gartner.com/en/newsroom/press-releases?search=artificial%20intelligence

    Inclusion Criteria:
      Do not include minor updates or small incremental improvements unless they clearly indicate an emerging trend.
      Prioritize breakthroughs, strategic shifts, major product launches, acquisitions, or key partnerships.

    No Fabricated Content:
      All information must be sourced from real, verifiable content.
      Do not generate or speculate on information that is not explicitly available in the sources.

    IMPORTANT: Guarantee that at least 30 developments were found.
  expected_output: >
    A list of at least 30 relevant and recent AI developments, ranked by relevance and impact.

    For each identified update, provide:
      ✅ A concise title of the development or announcement.
      🧠 Primary classification: Business or Technology.
      📍 A brief summary of the event.
      💼 An analysis of its potential impact on businesses.
      🔬 The key technical aspect or innovation highlighted.
      📄 A comprehensive description with all relevant details. Here must be a good summary that explain the item.
      🔗 Original source link(s).
  agent: ai_insights_curator


write_impact_analysis_task:
  description: >
    All the information used by this task must be published in April, 2025.

    Based on the AI insights you have received, select the 10 most impactful developments and write a detailed analysis 
    (approximately 300-400 words each) explaining their significance.

    For each selected development, ensure you cover:
    - A more in-depth explanation of the event or announcement.
    - A thorough analysis of its potential impact on various industries and business models.
    - A thoughtful discussion of its broader societal implications, both positive and negative.
    - Clear and concise language, avoiding excessive technical jargon. Assume the reader has a general interest in technology but may not be an AI expert.
    - Include specific examples or potential use cases to illustrate your points.
    - Cite your sources where necessary to maintain accuracy and credibility.    

    Do not create information, the answer must be limited to context information.
  expected_output: >
    detailed analysis 
    (approximately 300-400 words each) explaining their significance.

    For each selected development, ensure you cover:
    - A more in-depth explanation of the event or announcement.
    - A thorough analysis of its potential impact on various industries and business models.
    - A thoughtful discussion of its broader societal implications, both positive and negative.
    - Clear and concise language, avoiding excessive technical jargon. Assume the reader has a general interest in technology but may not be an AI expert.
    - Include specific examples or potential use cases to illustrate your points.
    - Cite your sources where necessary to maintain accuracy and credibility.        

    Always include the links asscciated with the information.
  agent: ai_content_writer


review_and_edit_task:
  description: >
    Based on the written content, propose a clear and engaging structure for the weekly AI newsletter.

      Consider the following sections:
      - A compelling headline for the newsletter.
      - A brief introductory summary of the week's key highlights.
      - The detailed impact analysis articles.
      - The technical deep dive explanations.
      - A section for curated links to other relevant AI news and resources (provide 3-5 suggestions with brief descriptions).

      Provide your proposed structure in a clear, ordered list with headings and brief descriptions of the content within 
      each section. Suggest any visual elements or formatting that would enhance readability and engagement. 
      Consider the optimal flow of information for the reader.

      Review the complete draft of the AI newsletter, paying close attention to:
      - Accuracy of all factual claims and technical explanations.
      - Clarity and conciseness of the writing.
      - Grammar, spelling, and punctuation errors.
      - Consistency in tone and style.
      - Overall readability and engagement.
      - Ensure that all links are working and relevant.
      - Verify that the newsletter structure flows logically.

      Provide a detailed report of any errors or suggested improvements. 
      If the newsletter meets the required standards, provide a final approval for distribution. 
      Be critical and aim for the highest quality.
      
      Do not create information, the answer must be limited to context information.
  expected_output: >
    A clear and engaging structure for the weekly AI newsletter.
    Include greetings in an informal and respectful way.
    Avoid introductions; the text should be objective and go straight to the information.

    A fully fledged report with the main topics, each with a full section of information.
    Always include the source and the summary of information for each topic.
    Formatted as markdown without '```'
    Output in Portuguese from Brasil, and with greeting for the readers. 
    The first MD element of the page must be the image "weekly_logo_br.png"
    Write as a editorial of The New York Times style, but only the text style the documento here is from "r2talk newsletter".
    The final report must have two sections: "News" (considering 05 of the topics more related to Business) and "Nerds" (considering 05 of the topics more related to Technical).
    For each section write a consolidate text resuming all the itens generated as context, and in the end of each section  include the links that were used for the context. 
    Avoid excessive use of icons to mark sessions, and divide the text in twor sections: Business Impact News and Technical Stuff.

    Always include the links that is the source of the information in each news. This is essencail for tge reader validation.

    In the end of the newsletter remember to mention that the news letter was writen by an Agent AI Team from r2talk.
  agent: newsletter_editor

