[project]
name = "wnews"
version = "0.1.0"
description = "wnews using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.108.0,<1.0.0"
]

[project.scripts]
wnews = "wnews.main:run"
run_crew = "wnews.main:run"
train = "wnews.main:train"
replay = "wnews.main:replay"
test = "wnews.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
